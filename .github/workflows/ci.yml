name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
        working-directory: plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci

      - name: Type check
        run: |
          $ErrorActionPreference = 'Stop'
          npx tsc --noEmit

      - name: Build and validate plugin
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build
          npm run validate

  companion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: companion/requirements.txt

      - name: Install dependencies and run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check -r companion/requirements.txt
          python -m compileall -q companion/app.py companion/tests
          python -m unittest discover -s companion/tests -v

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image without pushing
        uses: docker/build-push-action@v7
        with:
          context: companion
          file: companion/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

